# The pins of one EmiBSD system: which commit of each repository this release assembles.
# tools/manifest.py reads it; a pin moves only in a commit titled "manifest: <repo> to <12-hex>".

[release]
version = "unreleased"          # YEAR.MONTH when cut (docs/RELEASE.md); "unreleased" between releases
arch    = ["arm64"]             # amd64 joins after Kernel's N10

[kernel]
repo    = "https://github.com/EmiBSD/Kernel"
commit  = "ea7fc03286146582264f08f3e5d10b04c0d1c4e2"   # the tag's commit, 2026-11-05
release = "20261106-ea7fc032"   # taken from this GitHub pre-release, never built here: one artifact per arch
tools   = true                  # also checked out in src/kernel, for its xtask only (rdsetroot, media, smokes)
# What it contributes: bsd.mp (release profile, feature qemu), bsd.RAMDISK (the same kernel
# with an empty 32 MiB ramdisk, which OS fills with Userland's miniroot by rdsetroot to make
# bsd.rd), abi_openbsd.ko, BOOTAA64.EFI, BUILDINFO, in kernel-<tag>-<arch>.tar.zst.

[kernel.sha256]   # the artifact of each architecture
arm64 = "3a838cd599c175e62c63bfaf0598523b9cdff125a05b517c694f594f2e756eba"

[userland]
repo    = "https://github.com/EmiBSD/Userland"
commit  = "7b6d52999ab9b3dc696fbc7d33cbed053fad52fe"   # the tag's commit, 2026-11-05
release = "2026.11.0"   # taken from this GitHub release, never built here: one artifact per arch
# What it contributes: the inherited base system built for EmiBSD, its base, comp, game and
# man sets with their SHA256, in userland-<tag>-<arch>.tar (reproducible: Userland's
# `just dist <arch>` at the tag gives the same sums); its ramdisk boots on Kernel. Not yet in
# Kernel's install media, which still carry OpenBSD's userland as Kernel builds it.

[userland.sha256]   # the artifact of each architecture; amd64 joins when it is released
arm64 = "10cb79c4a4099a0b55686437c5789ee46cace1ffbb38247b5535ebb745744029"

[devtools]
repo   = "https://github.com/EmiBSD/DevTools"
commit = "63830d2c63c442e7faefb1058f46c63f3ca423be"   # main, 2026-10-31: llvm-23.1.4+emibsd.1, rust-1.99.1+emibsd.1
# What it contributes: the comp set (clang, lld, libc++; rustc, cargo, std) from T3 on.

[openbsd]
# The OpenBSD pin every repository above shares (LandingZone's; Kernel/reference/PINNED.md).
# Recorded here so a release states which OpenBSD it answers to; not fetched by this repo.
repo   = "https://github.com/EmiBSD/OpenBSD-src"
commit = "3ce1f3f79392ae4d60ce67bea5835d517caaa2ca"
