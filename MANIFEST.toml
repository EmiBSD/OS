# The pins of one EmiBSD system: which commit of each repository this release assembles.
# tools/manifest.py reads it; a pin moves only in a commit titled "manifest: <repo> to <12-hex>".

[release]
version = "unreleased"          # YEAR.MONTH when cut (docs/RELEASE.md); "unreleased" between releases
arch    = ["arm64"]             # amd64 joins after Kernel's N10
signify = "emibsd-80-base"      # the media signed with it (docs/MEDIA.md, Signing); keys/<it>.pub

[kernel]
repo    = "https://github.com/EmiBSD/Kernel"
commit  = "b2a15ba679d253e626164ed166b7ae49bcbd5438"   # the tag's commit, 2026-11-07
release = "20261107-b2a15ba6"   # taken from this GitHub pre-release, never built here: one artifact per arch
tools   = true                  # also checked out in src/kernel, for its xtask only (rdsetroot, media, smokes)
# What it contributes: bsd.mp (release profile, without feature qemu, the ABI linked in),
# bsd.RAMDISK (the same kernel with an empty 32 MiB ramdisk, which OS fills with Userland's
# miniroot by rdsetroot to make bsd.rd), BOOTAA64.EFI, BUILDINFO, in kernel-<tag>-<arch>.tar.zst.

[kernel.sha256]   # the artifact of each architecture
arm64 = "5479dd94db5d77fb45eed86b252a3868c2d4f52b68d3909ea2ee0f7995047b8a"

[userland]
repo    = "https://github.com/EmiBSD/Userland"
commit  = "d208e236b39aec9e4f35065051bae718dd14aedd"   # the tag's commit, 2026-11-07
release = "2026.11.3"   # taken from this GitHub release, never built here: one artifact per arch
tools   = true          # also checked out in src/userland, whose recipes build the host makefs
# What it contributes: the inherited base system built for EmiBSD, its base, comp, game and
# man sets (.tar.zst) with their SHA256, the installation notes INSTALL.<arch>, and the
# installer's ramdisk miniroot80.fs (rdsetroot into Kernel's bsd.RAMDISK gives bsd.rd), in
# userland-<tag>-<arch>.tar.zst (reproducible: Userland's `just dist <arch>` at the tag gives
# the same sums). Base carries the Kernel release's BOOTAA64.EFI in /usr/mdec; installed from
# local media, bsd.mp is /bsd.

[userland.sha256]   # the artifact of each architecture; amd64 joins when it is released
arm64 = "d7d895a261e11aec12d8e53fb780d82c320c69378f73cddcb9244ba1a6e09a4a"

[devtools]
repo   = "https://github.com/EmiBSD/DevTools"
commit = "832bb279392f918e1c631edf656e5a6da26ddcbb"   # tag llvm-23.1.4+emibsd.2, 2026-11-07; rust-1.99.1+emibsd.1 unchanged
# What it contributes: the comp set (clang, lld, libc++; rustc, cargo, std) from T3 on.

[openbsd]
# The OpenBSD pin every repository above shares (LandingZone's; Kernel/reference/PINNED.md).
# Recorded here so a release states which OpenBSD it answers to; not fetched by this repo.
repo   = "https://github.com/EmiBSD/OpenBSD-src"
commit = "3ce1f3f79392ae4d60ce67bea5835d517caaa2ca"
